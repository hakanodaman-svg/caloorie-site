<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caloorie</title>
<link rel="canonical" href="https://caloorie.com/en/">
<link rel="alternate" hreflang="en" href="https://caloorie.com/en/">
<link rel="alternate" hreflang="x-default" href="https://caloorie.com/en/">
<script>
(function(){
  var langs=["en"];
  var prefs=(navigator.languages||[navigator.language||""]).map(function(l){return l.toLowerCase();});
  var pick="en";
  for(var i=0;i<prefs.length;i++){
    var full=prefs[i], short=full.split("-")[0];
    if(langs.indexOf(full)>-1){pick=full;break;}
    if(langs.indexOf(short)>-1){pick=short;break;}
  }
  location.replace("/"+pick+"/");
})();
</script>
</head><body><noscript><a href="/en/">Caloorie</a></noscript></body></html>
